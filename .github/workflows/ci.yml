name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make check
        run: make check
      - name: coverage report
        if: always()
        run: make coverage | tee coverage.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.txt

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 30 seconds per fuzz target
        run: make fuzz-ci
